<!DOCTYPE html>
<html lang="en"  xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/output.css" rel="stylesheet">
    <style>
        .input-field {
            padding-left: 2rem;
        }
        .no-spinner::-webkit-outer-spin-button,
        .no-spinner::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .no-spinner[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex flex-col">
        <!-- App Header -->
        <header class="page-header">
            <div class="container-center py-4">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                        <i class="fas fa-graduation-cap text-white text-xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gradient">CampusConnect</h1>
                </div>
            </div>
        </header>

        <!-- Login Form -->
        <main class="flex-1 flex items-center justify-center px-4 py-12">
            <div class="w-full max-w-md space-y-8">
                <div class="text-center space-y-3">
                    <h2 class="text-3xl font-bold text-slate-900">Welcome Back</h2>
                    <p class="text-slate-600">Sign in to continue to your dashboard</p>
                </div>

                <form class="form-section backdrop-blur p-8 rounded-3xl shadow-2xl max-w-md mx-auto" method="post" th:action="@{/login}">
                    <!-- Email Field -->
                    <div class="input-icon-left">
                        <label class="label-text">Roll No</label>
                        <i class="input-icon fas fa-envelope absolute" style="left: 40px; top: 76px;"></i>
                        <input type="number" name="rollNo" required class="input-field no-spinner" placeholder="Enter your roll no" />
                    </div>

                    <!-- Password Field -->
                    <div class="input-icon-left">
                        <label class="label-text">Password</label>
                        <i class="input-icon fas fa-lock absolute" style="left: 44px; top: 150px;"></i>
                        <input type="password" name="password" class="input-field" placeholder="Enter your password" />
                    </div>

                    <!-- Remember & Forgot -->
                    <div class="flex items-center justify-between mb-5 mt-5">
                        <label class="flex items-center text-sm">
                            <input type="checkbox" class="w-4 h-4 text-indigo-600 rounded mr-2">
                            <span class="text-slate-700 font-medium">Remember me</span>
                        </label>
                        <a href="#" class="text-indigo-600 hover:text-indigo-700 font-semibold text-sm">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-primary w-full">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Sign In
                    </button>
                    <div th:if="${param.error}" class="mb-4 p-3 rounded-lg bg-red-100 text-red-700 text-sm font-medium border border-red-200">
                        <i class="fas fa-exclamation-circle mr-2"></i> Invalid Roll No or Password.
                    </div>
                </form>

                <div class="text-center">
                    <p class="text-sm text-slate-600">
                        Need help? <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-700">Contact Admin</a>
                    </p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
