<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Students – CampusConnect</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="app-shell">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <div th:replace="fragments/sidebar :: sidebar('students')"></div>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger-btn" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
        <span class="page-title">Registered Students</span>
      </div>
      <div class="topbar-right">
        <span class="badge badge-blue" th:text="${totalStudents + ' students'}">0 students</span>
      </div>
    </header>

    <main class="page-body">

      <div class="section-heading mb-4">
        <h2>All Students</h2>
        <div class="flex gap-2 flex-wrap items-center">
          <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Search by name, email…" id="searchInput" oninput="filterTable()"/>
          </div>
          <select class="form-control" style="max-width:150px;padding:.45rem .75rem;font-size:.82rem;"
                  onchange="location='?branch='+this.value">
            <option value="">All Departments</option>
            <option th:each="b : ${branches}" th:value="${b}"
                    th:selected="${param.branch == b}" th:text="${b}">Dept</option>
          </select>
        </div>
      </div>

      <!-- Desktop table -->
      <div class="card" style="padding:0;overflow:hidden;">
        <div class="table-wrapper">
          <table class="data-table" id="studentTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Student</th>
                <th>Email</th>
                <th>Department</th>
                <th>Year</th>
                <th>Roll No.</th>
                <th>Joined</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(students)}">
                <td colspan="7" class="text-center" style="padding:2rem;color:var(--text-muted);">
                  No students registered yet.
                </td>
              </tr>
              <tr th:each="s, stat : ${students}">
                <td class="text-muted text-small" th:text="${stat.index + 1}">1</td>
                <td>
                  <div class="flex items-center gap-2">
                    <div class="avatar" th:text="${#strings.substring(s.firstName,0,1)}">S</div>
                    <div>
                      <div style="font-weight:600;font-size:.875rem;"
                           th:text="${s.firstName + ' ' + s.lastName}">Name</div>
                      <div class="text-muted text-small" th:text="${'@' + s.firstName}">@user</div>
                    </div>
                  </div>
                </td>
                <td class="text-small" th:text="${s.email}">email</td>
                <td>
                  <span th:if="${s.branch}" class="badge badge-purple" th:text="${s.branch}">Dept</span>
                  <span th:unless="${s.branch}" class="text-muted text-small">—</span>
                </td>
                <td class="text-small" th:text="${s.semester ?: '—'}">—</td>
                <td class="text-small" th:text="${s.rollNumber ?: '—'}">—</td>
                <td class="text-small" th:text="${#temporals.format(s.createdAt,'dd MMM yyyy')}">date</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Mobile card view (shown via CSS at small screens) -->
      <style>
        @media (max-width: 639px) {
          .card[style*='padding:0'] { display: none; }
          #mobileCards { display: flex; flex-direction: column; gap: .75rem; }
        }
        @media (min-width: 640px) { #mobileCards { display: none; } }
      </style>

      <div id="mobileCards">
        <div th:each="s : ${students}" class="card">
          <div class="flex items-center gap-3 mb-2">
            <div class="avatar avatar-lg" th:text="${#strings.substring(s.firstName,0,1)}">S</div>
            <div>
              <div style="font-weight:700;" th:text="${s.firstName + ' ' + s.lastName}">Name</div>
              <div class="text-muted text-small" th:text="${s.email}">email</div>
            </div>
          </div>
          <div class="flex gap-2 flex-wrap">
            <span th:if="${s.branch}" class="badge badge-purple" th:text="${s.branch}">Dept</span>
            <span th:if="${s.semester}" class="badge badge-gray" th:text="${s.semester}">Year</span>
            <span th:if="${s.rollNumber}" class="badge badge-blue" th:text="${s.rollNumber}">Roll</span>
          </div>
        </div>
      </div>

      <div class="pagination" th:if="${totalPages > 1}">
        <button class="page-btn" th:disabled="${currentPage == 0}"
                th:onclick="|location='?page=${currentPage - 1}'|">‹</button>
        <button th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                class="page-btn" th:classappend="${i == currentPage} ? ' active'"
                th:onclick="|location='?page=${i}'|" th:text="${i + 1}">1</button>
        <button class="page-btn" th:disabled="${currentPage + 1 == totalPages}"
                th:onclick="|location='?page=${currentPage + 1}'|">›</button>
      </div>

    </main>
  </div>
</div>

<script th:src="@{/js/sidebar.js}"></script>
<script>
  function filterTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('#studentTable tbody tr').forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  }
</script>
</body>
</html>
