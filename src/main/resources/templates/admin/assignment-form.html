<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${assignment.id != null} ? 'Edit Assignment' : 'New Assignment'">Assignment – CampusConnect</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="app-shell">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <div th:replace="fragments/sidebar :: sidebar('assignments')"></div>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger-btn" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
        <span class="page-title"
              th:text="${assignment.id != null} ? 'Edit Assignment' : 'New Assignment'">Assignment</span>
      </div>
      <div class="topbar-right">
        <a th:href="@{/admin/assignments}" class="btn btn-ghost btn-sm">← Back</a>
      </div>
    </header>

    <main class="page-body">
      <div style="max-width:720px;margin:0 auto;">

        <div class="card">
          <div class="card-header">
            <span class="card-title"
                  th:text="${assignment.id != null} ? '✏️ Edit Assignment' : '📝 Create Assignment'">Form</span>
          </div>

          <form th:action="${assignment.id != null}
                           ? @{/admin/assignments/{id}/update(id=${assignment.id})}
                           : @{/admin/assignments/save}"
                th:object="${assignment}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group mb-3">
              <label class="form-label" for="title">Assignment Title *</label>
              <input class="form-control" type="text" id="title" th:field="*{title}"
                     placeholder="e.g. Data Structures Lab – Week 4" required/>
              <span class="form-error" th:errors="*{title}"></span>
            </div>

            <div class="form-grid mb-3">
              <!-- <div class="form-group">
                <label class="form-label" for="subject">Subject *</label>
                <input class="form-control" type="text" id="subject" th:field="*{subject}"
                       placeholder="e.g. Computer Science" required/>
                <span class="form-error" th:errors="*{subject}"></span>
              </div> -->
              <div class="form-group">
                <label class="form-label" for="dueDate">Due Date *</label>
                <input class="form-control" type="datetime-local" id="dueDate" th:field="*{dueDate}" required/>
                <span class="form-error" th:errors="*{dueDate}"></span>
              </div>
            </div>

            <div class="form-group mb-3">
              <label class="form-label" for="description">Description</label>
              <textarea class="form-control" id="description" th:field="*{description}"
                        placeholder="Describe the assignment in detail…" rows="4"></textarea>
            </div>

            <!-- <div class="form-grid mb-3">
              <div class="form-group">
                <label class="form-label" for="maxMarks">Max Marks</label>
                <input class="form-control" type="number" id="maxMarks" th:field="*{maxMarks}"
                       min="0" placeholder="100"/>
              </div>
              <div class="form-group">
                <label class="form-label" for="status">Status</label>
                <select class="form-control" id="status" th:field="*{status}">
                  <option value="ACTIVE">Active</option>
                  <option value="DUE_SOON">Due Soon</option>
                  <option value="OVERDUE">Overdue</option>
                  <option value="COMPLETED">Completed</option>
                </select>
              </div>
            </div> -->

            <!-- <div class="form-group mb-4">
              <label class="form-label" for="attachmentUrl">Attachment URL (optional)</label>
              <input class="form-control" type="url" id="attachmentUrl" th:field="*{attachmentUrl}"
                     placeholder="https://drive.google.com/…"/>
              <span class="form-hint">Paste a link to any reference material or file.</span>
            </div> -->

            <hr class="divider"/>
            <div class="flex gap-3 flex-wrap">
              <button type="submit" class="btn btn-primary">
                <span th:text="${assignment.id != null} ? 'Update Assignment' : 'Create Assignment'">Save</span>
              </button>
              <a th:href="@{/admin/assignments}" class="btn btn-ghost">Cancel</a>
            </div>
          </form>
        </div>

      </div>
    </main>
  </div>
</div>

<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
