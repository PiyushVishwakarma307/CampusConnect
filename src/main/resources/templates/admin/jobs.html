<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Postings – CampusConnect</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="app-shell">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <div th:replace="fragments/sidebar :: sidebar('jobs')"></div>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger-btn" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
        <span class="page-title">Job Postings</span>
      </div>
      <div class="topbar-right">
        <a th:href="@{/admin/jobs/new}" class="btn btn-primary btn-sm">+ Post Job</a>
      </div>
    </header>

    <main class="page-body">

      <div th:if="${successMessage}" class="alert alert-success mb-4" th:text="${successMessage}"></div>

      <div class="section-heading mb-4">
        <h2>All Job Postings</h2>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Search jobs…" id="searchInput" oninput="filterTable()"/>
        </div>
      </div>

      <div class="card" style="padding:0;overflow:hidden;">
        <div class="table-wrapper">
          <table class="data-table" id="jobTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Job Title</th>
                <th>Company</th>
                <th>Type</th>
                <th>Location</th>
                <th>Deadline</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(jobs)}">
                <td colspan="7" class="text-center" style="padding:2rem;color:var(--text-muted);">
                  No job postings yet. <a th:href="@{/admin/jobs/new}">Create one</a>.
                </td>
              </tr>
              <tr th:each="j, stat : ${jobs}">
                <td class="text-muted text-small" th:text="${stat.index + 1}">1</td>
                <td>
                  <div style="font-weight:600;font-size:.875rem;" th:text="${j.title}">Title</div>
                  <div class="text-muted text-small" th:text="${#strings.abbreviate(j.description,45)}">Desc</div>
                </td>
                <td class="text-small" th:text="${j.company}">Company</td>
                <td>
                  <span class="badge"
                        th:classappend="${j.type == 'Internship'} ? 'badge-purple'
                                     : (${j.type == 'Remote'}     ? 'badge-blue'
                                     : (${j.type == 'Part-Time'}  ? 'badge-amber' : 'badge-green'))"
                        th:text="${j.type}">Type</span>
                </td>
                <td class="text-small" th:text="${j.location}">Location</td>
                <td class="text-small" th:text="${#temporals.format(j.deadline,'dd MMM yyyy')}">date</td>
                <td>
                  <div style="display: flex;  gap: 0.5rem;">
                    <a th:href="@{/admin/jobs/{id}/edit(id=${j.id})}" class="btn btn-ghost btn-sm">✏️</a>
                    <form th:action="@{/admin/jobs/{id}/delete(id=${j.id})}" method="post"
                          onsubmit="return confirm('Delete this job posting?')">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-danger btn-sm">🗑</button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="pagination" th:if="${totalPages > 1}">
        <button class="page-btn" th:disabled="${currentPage == 0}"
                th:onclick="|location='?page=${currentPage - 1}'|">‹</button>
        <button th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                class="page-btn" th:classappend="${i == currentPage} ? ' active'"
                th:onclick="|location='?page=${i}'|" th:text="${i + 1}">1</button>
        <button class="page-btn" th:disabled="${currentPage + 1 == totalPages}"
                th:onclick="|location='?page=${currentPage + 1}'|">›</button>
      </div>

    </main>
  </div>
</div>

<script th:src="@{/js/sidebar.js}"></script>
<script>
  function filterTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('#jobTable tbody tr').forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  }
</script>
</body>
</html>
