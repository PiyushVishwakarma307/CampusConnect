<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Assignments – CampusConnect</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="app-shell">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <div th:replace="fragments/sidebar :: sidebar('assignments')"></div>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger-btn" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
        <span class="page-title">Manage Assignments</span>
      </div>
      <div class="topbar-right">
        <a th:href="@{/admin/assignments/new}" class="btn btn-primary btn-sm">+ New Assignment</a>
      </div>
    </header>

    <main class="page-body">

      <div th:if="${successMessage}" class="alert alert-success mb-4" th:text="${successMessage}"></div>

      <!-- Search & Filter row -->
      <div class="section-heading mb-4">
        <h2>All Assignments</h2>
        <div class="flex gap-2 flex-wrap items-center">
          <div class="search-bar" style="max-width:220px;">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Search…" id="searchInput" oninput="filterTable()"/>
          </div>
          <!-- <select class="form-control" style="max-width:140px;padding:.45rem .75rem;font-size:.82rem;"
                  onchange="location='?subject='+this.value">
            <option value="">All Subjects</option>
            <option th:each="subj : ${subjects}" th:value="${subj}"
                    th:selected="${param.subject == subj}" th:text="${subj}">Subject</option>
          </select> -->
        </div>
      </div>

      <!-- Table (desktop) -->
      <div class="card" style="padding:0;overflow:hidden;" id="desktopTable">
        <div class="table-wrapper">
          <table class="data-table" id="assignTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Due Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(assignments)}">
                <td colspan="6" class="text-center" style="padding:2rem;color:var(--text-muted);">
                  No assignments found.
                </td>
              </tr>
              <tr th:each="a, stat : ${assignments}">
                <td class="text-muted text-small" th:text="${stat.index + 1}">1</td>
                <td>
                  <div style="font-weight:600;font-size:.875rem;" th:text="${a.title}">Title</div>
                  <div class="text-muted text-small" th:text="${#strings.abbreviate(a.description, 50)}">Desc</div>
                </td>
                <td class="text-small" th:text="${#temporals.format(a.dueDate,'dd MMM yyyy')}">date</td>
                <td>
                  <span class="badge"
                        th:classappend="${a.status == 'OVERDUE'}   ? 'badge-red'
                                     : (${a.status == 'DUE_SOON'}  ? 'badge-amber'
                                     : (${a.status == 'COMPLETED'} ? 'badge-green' : 'badge-blue'))"
                        th:text="${a.status}">Active</span>
                </td>
                <td>
                  <div style="display: flex;  gap: 0.5rem;">
                    <a th:href="@{/admin/assignments/{id}/edit(id=${a.id})}" class="btn btn-ghost btn-sm">✏️ Edit</a>
                    <form th:action="@{/admin/assignments/{id}/delete(id=${a.id})}" method="post"
                          onsubmit="return confirm('Delete this assignment?')">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-danger btn-sm">🗑</button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Cards (mobile fallback via CSS) -->
      <!-- Pagination -->
      <div class="pagination" th:if="${totalPages > 1}">
        <button class="page-btn" th:disabled="${currentPage == 0}"
                th:onclick="|location='?page=${currentPage - 1}'|">‹</button>
        <button th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                class="page-btn" th:classappend="${i == currentPage} ? ' active'"
                th:onclick="|location='?page=${i}'|" th:text="${i + 1}">1</button>
        <button class="page-btn" th:disabled="${currentPage + 1 == totalPages}"
                th:onclick="|location='?page=${currentPage + 1}'|">›</button>
      </div>

    </main>
  </div>
</div>

<script th:src="@{/js/sidebar.js}"></script>
<script>
  function filterTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('#assignTable tbody tr').forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  }
</script>
</body>
</html>
