<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center bg-gray-100 p-6">
        <div class="bg-white flex flex-col md:flex-row w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden">
          
          <div class="md:w-1/2 bg-indigo-600 p-12 text-white flex flex-col justify-center">
            <h2 class="text-3xl font-bold mb-4">Welcome Back!</h2>
            <p class="text-indigo-100">Login to access your personalized dashboard and stay updated with your campus activities.</p>
          </div>
      
          <div class="md:w-1/2 p-8 md:p-12">
            <form class="space-y-6">
              <h3 class="text-2xl font-bold text-gray-800">Login</h3>
              <div>
                <label class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" class="w-full mt-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="you@campus.edu">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" class="w-full mt-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
              </div>
              <button class="w-full bg-indigo-600 text-white p-3 rounded-lg font-semibold hover:bg-indigo-700 transition">Sign In</button>
              <p class="text-center text-sm text-gray-600 mt-4">
                Don't have an account? <a href="/signup" class="text-indigo-600 font-bold">Sign Up</a>
              </p>
            </form>
          </div>
      
        </div>
      </div>
</body>
</html>
