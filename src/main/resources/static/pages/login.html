<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="min-h-screen bg-slate-50 flex flex-col justify-center py-12 px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
      <h2 class="text-center text-3xl font-extrabold text-indigo-900">CampusConnect</h2>
      <p class="mt-2 text-center text-sm text-slate-600">Log in to your account</p>
    </div>
  
    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
      <div class="bg-gray-200 py-8 px-6 shadow-xl rounded-2xl border border-slate-100">
        <form class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-slate-700">Email address</label>
            <input type="email" required class="mt-1 block w-full px-3 py-3 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-base" placeholder="exampler@gmail.com" autocomplete="email">
          </div>
  
          <div>
            <label class="block text-sm font-medium text-slate-700">Password</label>
            <input type="password" required class="mt-1 block w-full px-3 py-3 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-base" autocomplete="current-password" placeholder="enter your password">
          </div>
  
          <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-base font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition-transform">
            Log in
          </button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
