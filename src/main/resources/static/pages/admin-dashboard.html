<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="card-base max-w-2xl mx-auto mt-10">
        <div class="p-6 border-b border-slate-100">
          <h2 class="text-xl font-bold">Post New Opportunity</h2>
        </div>
        
        <form class="p-6 space-y-5">
          <div>
            <label class="label-text">Job Title</label>
            <input type="text" class="input-field" placeholder="e.g. Software Intern">
          </div>
      
          <div>
            <label class="label-text">Company Name</label>
            <input type="text" class="input-field" placeholder="e.g. CampusConnect Tech">
          </div>
      
          <div class="pt-4">
            <button type="submit" class="btn-primary w-full">Publish Opportunity</button>
          </div>
        </form>
      </section>
</body>
</html>
